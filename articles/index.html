<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | John Rogan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-cream: #f8f4e8;
            --paper-dark: #e8e0cc;
            --ink-black: #1a1a1a;
            --ink-faded: #4a4a4a;
            --accent-red: #8b2323;
            --accent-blue: #0077b5;
            --accent-maize: #FFCB05;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Baskerville', serif;
            background: var(--paper-cream);
            color: var(--ink-black);
            min-height: 100vh;
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: soft-light;
        }
        
        /* Masthead */
        .masthead {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 3px double var(--ink-black);
            background: var(--paper-cream);
        }
        
        .back-home {
            position: absolute;
            left: 2rem;
            top: 2rem;
            color: var(--ink-faded);
            text-decoration: none;
            font-size: 0.9rem;
            font-style: italic;
            transition: color 0.3s;
        }
        
        .back-home:hover {
            color: var(--ink-black);
        }
        
        .masthead-title {
            font-family: 'Old Standard TT', serif;
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, var(--ink-black) 0%, var(--ink-faded) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .masthead-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 0.75rem 0;
        }
        
        .ornament-line {
            width: 120px;
            height: 1px;
            background: var(--ink-black);
        }
        
        .ornament-symbol {
            font-size: 1.2rem;
            color: var(--ink-faded);
        }
        
        .masthead-date {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--ink-faded);
        }
        
        /* Social links header */
        .social-header {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1rem;
            border-bottom: 1px solid var(--ink-faded);
            background: var(--paper-dark);
        }
        
        .social-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--ink-black);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
        }
        
        .social-link:hover {
            border-color: var(--ink-black);
        }
        
        .social-link svg {
            width: 18px;
            height: 18px;
        }
        
        .social-link img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        
        /* Main content */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            font-style: italic;
            color: var(--ink-faded);
            position: relative;
            display: inline-block;
        }
        
        .section-title::before,
        .section-title::after {
            content: '*';
            margin: 0 1rem;
            color: var(--ink-faded);
        }
        
        /* Articles grid */
        .articles-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .article-card {
            position: relative;
            background: var(--paper-cream);
            border: 1px solid var(--ink-faded);
            padding: 1.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .article-card::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            background: var(--paper-dark);
            z-index: -1;
            transition: all 0.3s;
        }
        
        .article-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink-faded);
        }
        
        .article-card:hover::before {
            top: 6px;
            left: 6px;
        }
        
        /* Platform indicator */
        .platform-indicator {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 40px 40px 0;
        }
        
        .platform-indicator.substack {
            border-color: transparent #ff6719 transparent transparent;
        }
        
        .platform-indicator.michigandaily {
            border-color: transparent var(--accent-maize) transparent transparent;
        }
        
        .platform-indicator.linkedin {
            border-color: transparent #0077b5 transparent transparent;
        }
        
        .platform-label {
            position: absolute;
            top: 6px;
            right: 2px;
            font-size: 0.5rem;
            font-weight: 700;
            color: white;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transform: rotate(45deg) translateX(4px);
        }
        
        .article-date {
            font-size: 0.75rem;
            font-style: italic;
            color: var(--ink-faded);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }
        
        .article-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }
        
        .article-excerpt {
            font-size: 0.9rem;
            color: var(--ink-faded);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .read-more {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.8rem;
            font-style: italic;
            color: var(--accent-red);
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            border: 2px dashed var(--ink-faded);
        }
        
        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1rem;
        }
        
        .empty-state p {
            color: var(--ink-faded);
            font-size: 0.95rem;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 3px double var(--ink-black);
            margin-top: 4rem;
            font-size: 0.85rem;
            color: var(--ink-faded);
        }
        
        footer a {
            color: var(--accent-red);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            font-size: 0.75rem;
            color: var(--ink-faded);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        
        .legend-dot.substack { background: #ff6719; }
        .legend-dot.michigandaily { background: var(--accent-maize); }
        .legend-dot.linkedin { background: #0077b5; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .masthead-title { font-size: 2.5rem; }
            .social-header { 
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }
            .back-home {
                position: relative;
                left: 0;
                top: 0;
                display: block;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="masthead">
        <a href="/" class="back-home">Return to Portfolio</a>
        <h1 class="masthead-title">The Dispatch</h1>
        <div class="masthead-ornament">
            <span class="ornament-line"></span>
            <span class="ornament-symbol">*</span>
            <span class="ornament-line"></span>
        </div>
        <p class="masthead-date">Writings & Musings of John Rogan</p>
    </header>
    
    <nav class="social-header">
        <a href="https://substack.com" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/></svg>
            Substack
        </a>
        <a href="https://www.michigandaily.com" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 7l11 5 9-4.09V17h2V7L12 2z"/><path d="M12 13.45L5 10v6.09c0 2.17 3.13 4.41 7 4.41s7-2.24 7-4.41V10l-7 3.45z"/></svg>
            Michigan Daily
        </a>
        <a href="https://linkedin.com" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            LinkedIn
        </a>
    </nav>
    
    <main>
        <div class="section-header">
            <h2 class="section-title">Recent Publications</h2>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <span class="legend-dot substack"></span>
                <span>Substack</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot michigandaily"></span>
                <span>Michigan Daily</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot linkedin"></span>
                <span>LinkedIn</span>
            </div>
        </div>
        
        <div id="articles-container" class="articles-container">
            <!-- Articles will be loaded here via JavaScript -->
        </div>
        
        <div id="empty-state" class="empty-state" style="display: none;">
            <h3>No Articles Yet</h3>
            <p>Check back soon for published writings.</p>
        </div>
    </main>
    
    <footer>
        <p>The Dispatch - Est. 2025 | <a href="/">Return to Portfolio</a></p>
    </footer>
    
    <script>
        // Fetch and render articles from JSON
        async function loadArticles() {
            const container = document.getElementById('articles-container');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const response = await fetch('/articles/articles.json');
                const articles = await response.json();
                
                if (articles.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                
                // Sort by date (newest first)
                articles.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                articles.forEach(article => {
                    const card = createArticleCard(article);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading articles:', error);
                emptyState.style.display = 'block';
            }
        }
        
        function createArticleCard(article) {
            const card = document.createElement('a');
            card.href = article.link;
            card.target = '_blank';
            card.className = 'article-card';
            
            // Format date
            const date = new Date(article.date);
            const formattedDate = date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            // Determine platform from link
            let platform = 'substack';
            if (article.link.includes('michigandaily.com')) {
                platform = 'michigandaily';
            } else if (article.link.includes('linkedin.com')) {
                platform = 'linkedin';
            }
            
            card.innerHTML = `
                <div class="platform-indicator ${platform}">
                    <span class="platform-label"></span>
                </div>
                <p class="article-date">${formattedDate}</p>
                <h3 class="article-title">${article.title}</h3>
                <span class="read-more">Read More</span>
            `;
            
            return card;
        }
        
        // Load articles on page load
        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
